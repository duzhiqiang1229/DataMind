name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: datamind
          POSTGRES_PASSWORD: datamind_test
          POSTGRES_DB: datamind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datamind -d datamind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: datamind
      DB_PASSWORD: datamind_test
      DB_NAME: datamind_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      JWT_SECRET_KEY: ci-only-jwt-secret-at-least-24-characters
      ENCRYPTION_KEY: xMdM7FJTeGxuAVhX2B1T0EiL3yx92vkzcSfrpjXeUaM=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Critical static checks
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Unit tests
        run: pytest -q
      - name: Integration tests
        run: pytest -q -m integration
      - name: Migration from empty database
        run: alembic upgrade head && alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret build configuration
        run: cp backend/.env.example backend/.env
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml build backend frontend
