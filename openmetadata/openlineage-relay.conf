server {
    listen 8587;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Spark OpenLineage 1.39 treats the configured endpoint differently from
    # the Python client and posts to the collection path. Normalize it to the
    # OpenMetadata event endpoint while keeping all normal requests unchanged.
    location = /api/v1/openlineage/ {
        proxy_pass http://openmetadata-server:8585/api/v1/openlineage/lineage;
        include /run/secrets/openlineage-auth.conf;
        proxy_set_header Content-Type $content_type;
    }

    location / {
        proxy_pass http://openmetadata-server:8585;
        include /run/secrets/openlineage-auth.conf;
        proxy_set_header Content-Type $content_type;
    }
}
