# Pytest configuration for DataMind Backend
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: marks tests that require a running PostgreSQL + Redis (deselect with '-m "not integration"')
addopts = -v --tb=short -m "not integration"
