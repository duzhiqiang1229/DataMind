# ============================================================
# Alembic Configuration for DataMind
# ============================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for naming (use local timezone)
timezone = Asia/Shanghai

# Output encoding
output_encoding = utf-8

# Database URL is set programmatically in env.py from app.core.config
# (uses database_url_sync property = postgresql+psycopg2://...)

# --- post_write hooks ---
# format Python code with black if available
# post_write_hooks = black
# black_type = console_scripts
# black_entrypoint = black
# black_options = -l 100 --preview

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
